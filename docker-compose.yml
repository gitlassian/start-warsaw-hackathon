name: rollcall

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rollcall
      POSTGRES_PASSWORD: rollcall
      POSTGRES_DB: rollcall
    ports: ["5432:5432"]
    volumes: [db:/var/lib/postgresql/data]

  minio:
    # minio/minio images are no longer published; Chainguard ships the same server.
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: rollcall
      MINIO_ROOT_PASSWORD: rollcall-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]

volumes:
  db:
  minio:
